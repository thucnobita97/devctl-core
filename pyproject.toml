[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devctl-core"
version = "0.2.1.dev0"
description = "Core library cho devctl toolkit"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Internal" }]
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "typer>=0.27.3",
]

[project.scripts]
devctl = "devctl_core.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/devctl_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/devctl_core/py.typed" = "devctl_core/py.typed"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=devctl_core --cov-report=term-missing"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20260906",
]
